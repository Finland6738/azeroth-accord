name: In-game test report
description: Report the result of a check done in the real WoW Forever client (spike M0 or the release checklist).
title: "[In-game] "
labels: ["in-game", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for the checks that only the real client can answer (docs/specs/SPEC-09-quality-release.md).
        **Privacy:** replace player, guild and account names with placeholders.
  - type: input
    id: check
    attributes:
      label: Check
      description: The id of the check, for example S1 (the Accord tab in the guild window) or the checklist and step, such as M3 step 4 or release step 12.
      placeholder: "S1"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Game client
      description: The `client:` and `locale:` lines of the `/accord debug` report.
      placeholder: "1.60.1 (build 70170), enUS"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works as the spec expects
        - Works differently (details below)
        - Does not work
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What you did and what you saw
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: The /accord debug report (optional, recommended)
      description: Type `/accord debug`, press Ctrl+C in the box and paste it here. The checks of M1 to M6 need the lists of what the game gave the addon (the Features and APIs sections). It contains no player or guild names.
      render: text
