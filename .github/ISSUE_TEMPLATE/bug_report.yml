name: Bug report
description: Something in Azeroth Accord does not work as expected.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Azeroth Accord.
        **Privacy:** do not paste other players' names, whispers, chat logs, account names or folder paths from your PC. Replace them with placeholders such as `<player>`, `<guild>` or `<account>`.
        Not sure it is a bug, or just want to share feedback? Use the [Feedback discussions](https://github.com/Finland6738/azeroth-accord/discussions/categories/feedback) instead.
  - type: input
    id: version
    attributes:
      label: Addon version
      description: The `addon:` line at the top of the `/accord debug` report, or the AddOns list at the character screen.
      placeholder: "0.x.y"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Game client
      description: The `client:` and `locale:` lines of the `/accord debug` report. WoW Forever build and game language.
      placeholder: "1.60.1 (build 70170), enUS"
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Your role when it happened
      description: The `role:` line of the `/accord debug` report.
      options:
        - Guild member
        - Officer
        - Guild Master
    validations:
      required: true
  - type: input
    id: guild_size
    attributes:
      label: Guild size (optional)
      description: The `guild size:` line of the report, a number of members. It matters for slowness and memory problems.
      placeholder: "about 200"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. Open the guild window and the Accord tab
        2. ...
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: The /accord debug report (please paste it whole)
      description: |
        Type `/accord debug` in the game: the report opens in a box, already selected. Press Ctrl+C and paste it here, whole: it starts with the lines above (version, client, language, role, guild size) and then holds the capabilities, the sync state, the sizes of the saved data, the memory and the last addon errors. It contains no player or guild names, and names in an error text are replaced by placeholders. If the game also showed a Lua error box, paste its text too. Remove anything else you do not want to share.
      render: text
